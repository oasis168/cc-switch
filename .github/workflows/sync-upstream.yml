name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点自动同步
  workflow_dispatch:       # 支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync upstream main to origin main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main

      - name: Rebase my-features onto main
        run: |
          git checkout my-features
          git rebase main
          git push origin my-features --force-with-lease
        continue-on-error: true  # rebase 有冲突时需手动处理，不阻断主流程
